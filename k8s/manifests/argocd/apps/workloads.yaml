# ArgoCD Application — prod 워크로드 (sync-wave: 1, monitoring 이후)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doktori-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SuperSon7/doktori-cloud.git
    targetRevision: main
    path: k8s/manifests/workloads
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # API와 Chat의 replica 수는 HPA가 관리한다. Git의 최초 생성값과
  # HPA가 계산한 실행 중 replica 수가 Argo CD self-heal로 충돌하지 않게 한다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: api
      namespace: prod
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: chat
      namespace: prod
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
