cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-a
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-b
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-c
cluster_partition_handling = pause_minority
default_queue_type = quorum
quorum_queue.initial_cluster_size = 3
prometheus.return_per_object_metrics = true
vm_memory_high_watermark.absolute = 512MiB
disk_free_limit.absolute = 512MB
management.tcp.port = 15672
prometheus.tcp.port = 15692
