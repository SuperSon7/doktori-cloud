name: doktori-apm-pilot
services:
  mysql:
    image: mysql@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: apmpilot
      MYSQL_USER: pilot
      MYSQL_PASSWORD: ${DB_PASSWORD:?run init}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run init}
    networks:
    - pilot
    mem_limit: 768m
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      interval: 5s
      retries: 40
    volumes:
    - mysql:/var/lib/mysql
  api:
    image: eclipse-temurin@sha256:decee204b9a1eb333c364ba4d859a6b1380eb13f0980d2acfd65c09fee53a48a
    command:
    - java
    - -javaagent:/agent/otel.jar
    - -jar
    - /app/apm-pilot.jar
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      OTEL_SERVICE_NAME: doktori-api-pilot
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.namespace=doktori
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_TRACES_SAMPLER: always_on
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_JDBC_STATEMENT_SANITIZER_ENABLED: 'true'
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: ''
    volumes:
    - ./.runtime/apm-pilot.jar:/app/apm-pilot.jar:ro
    - ./.runtime/otel.jar:/agent/otel.jar:ro
    - logs:/logs
    networks:
    - pilot
    mem_limit: 768m
    depends_on:
      mysql:
        condition: service_healthy
      alloy:
        condition: service_started
  tempo:
    image: grafana/tempo@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
    command:
    - -config.file=/etc/tempo.yaml
    volumes:
    - ./tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
    - /tmp/tempo:uid=10001,gid=10001
    networks:
    - pilot
    mem_limit: 512m
  alloy:
    image: grafana/alloy@sha256:579582bce40049f2e27bd1e445000689c907a41f0495cb0d0c7f65609316ba7c
    command:
    - run
    - /etc/alloy/config.alloy
    - --server.http.listen-addr=0.0.0.0:12345
    volumes:
    - ./config.alloy:/etc/alloy/config.alloy:ro
    - logs:/logs:ro
    networks:
    - pilot
    mem_limit: 256m
  loki:
    image: grafana/loki@sha256:847c287ada0e12603910589f42038c5cdaaad04e248bd1dc6c6e0920a235f427
    command:
    - -config.file=/etc/loki.yaml
    volumes:
    - ./loki.yaml:/etc/loki.yaml:ro
    networks:
    - pilot
    mem_limit: 384m
  grafana:
    image: grafana/grafana@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    environment:
      GF_SECURITY_ADMIN_USER: lab
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
    - ./datasources.yaml:/etc/grafana/provisioning/datasources/apm.yaml:ro
    networks:
    - pilot
    mem_limit: 384m
  gateway:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
    - 127.0.0.1:18090:8080
    - 127.0.0.1:13200:3200
    - 127.0.0.1:13101:3100
    - 127.0.0.1:13001:3000
    volumes:
    - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - pilot
    - access
    mem_limit: 64m
    depends_on:
    - api
    - grafana
    - loki
    - tempo
networks:
  pilot:
    internal: true
  access: {}
volumes:
  mysql: {}
  logs: {}
