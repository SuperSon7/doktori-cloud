# cloud-pr-alert.yml
name: PR Review Request Notification
on:
  pull_request:
    types: [review_requested] # PR이 처음 열렸을 때만!

jobs:
  notify-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Discord reviewer mention
        id: reviewer
        env:
          DISCORD_ID_VANI: ${{ vars.DISCORD_ID_VANI }}
          DISCORD_ID_HALAAND: ${{ vars.DISCORD_ID_HALAAND }}
          REQUESTED_GITHUB_USER: ${{ github.event.requested_team.name || github.event.requested_reviewer.login }}
        run: |
          case "$REQUESTED_GITHUB_USER" in
            "SuperSon7")
              if [ -n "$DISCORD_ID_VANI" ]; then MENTION="<@$DISCORD_ID_VANI>"; else MENTION="$REQUESTED_GITHUB_USER"; fi
              ;;
            "JI1047")
              if [ -n "$DISCORD_ID_HALAAND" ]; then MENTION="<@$DISCORD_ID_HALAAND>"; else MENTION="$REQUESTED_GITHUB_USER"; fi
              ;;
            *)
              # 매핑 안 된 사람이면 그냥 백엔드 팀 전체 호출 (안전장치)
              MENTION="@CloudTeam (리뷰어 매핑 필요)"
              ;;
          esac
          echo "mention=$MENTION" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          content: |
            👀 **[코드 리뷰 요청]**

            ${{ steps.reviewer.outputs.mention }} 님! **${{ github.actor }}** 님이 리뷰를 요청했습니다.

            제목: **${{ github.event.pull_request.title }}**
            링크: ${{ github.event.pull_request.html_url }}
